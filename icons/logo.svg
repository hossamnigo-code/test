<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4f4c"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Shine overlay -->
  <rect x="10" y="10" width="180" height="90" rx="36" ry="36" fill="url(#shineGrad)"/>

  <!-- Decorative accent bar -->
  <rect x="44" y="140" width="112" height="4" rx="2" fill="#5eead4" opacity="0.6"/>

  <!-- H letter -->
  <g fill="#ffffff">
    <!-- H left stem -->
    <rect x="40" y="58" width="14" height="72" rx="4"/>
    <!-- H right stem -->
    <rect x="90" y="58" width="14" height="72" rx="4"/>
    <!-- H crossbar -->
    <rect x="40" y="88" width="64" height="13" rx="4"/>
  </g>

  <!-- B letter -->
  <g fill="#ffffff">
    <!-- B stem -->
    <rect x="112" y="58" width="14" height="72" rx="4"/>
    <!-- B top cap -->
    <rect x="112" y="58" width="42" height="12" rx="4"/>
    <!-- B top bump arc (simulated with rects + circles) -->
    <rect x="148" y="70" width="12" height="23" rx="6"/>
    <!-- B mid bar -->
    <rect x="112" y="90" width="44" height="12" rx="4"/>
    <!-- B bottom bump arc -->
    <rect x="150" y="102" width="13" height="24" rx="6"/>
    <!-- B bottom cap -->
    <rect x="112" y="118" width="45" height="12" rx="4"/>
  </g>
</svg>
