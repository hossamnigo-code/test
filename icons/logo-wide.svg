  <rect x="12" y="18" width="6" height="44" rx="2" fill="#fff"/>
  <rect x="42" y="18" width="6" height="44" rx="2" fill="#fff"/>
  <rect x="12" y="37" width="36" height="7" rx="2" fill="#fff"/>

  <!-- B in icon -->
  <rect x="54" y="18" width="6" height="44" rx="2" fill="#fff"/>
  <rect x="54" y="18" width="20" height="6" rx="2" fill="#fff"/>
  <rect x="68" y="24" width="6" height="16" rx="3" fill="#fff"/>
  <rect x="54" y="38" width="21" height="6" rx="2" fill="#fff"/>
  <rect x="69" y="44" width="6" height="15" rx="3" fill="#fff"/>
  <rect x="54" y="56" width="22" height="6" rx="2" fill="#fff"/>

  <!-- "HB Bank" wordmark -->
  <text x="88" y="46" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="28" fill="#0b3b39" letter-spacing="-0.5">HB Bank</text>
  <!-- Tagline -->
